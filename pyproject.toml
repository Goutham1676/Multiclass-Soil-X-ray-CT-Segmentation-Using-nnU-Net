# Configuration for the soil CT segmentation package.
# Defines package information, test discovery, and code-quality settings.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soilct_segmentation"
version = "0.1.0"
description = "Tools for soil X-ray CT preprocessing and multiclass annotation"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["soilct_segmentation*"]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["soilct_segmentation/tests"]

filterwarnings = [
    "ignore:`json_encoders` is deprecated:DeprecationWarning"
]
